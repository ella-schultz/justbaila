name = "justbaila-inner-circle-api"
main = "src/index.js"
compatibility_date = "2026-09-23"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://justbaila.com,https://www.justbaila.com,http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "justbaila-inner-circle"
database_id = "8fdb1f2c-08b1-4ed0-aad3-54783b802916"
migrations_dir = "migrations"

# After justbaila.com is active in Cloudflare DNS, add this route in the
# Cloudflare dashboard or uncomment it here:
# routes = [{ pattern = "justbaila.com/api/*", zone_name = "justbaila.com" }]
